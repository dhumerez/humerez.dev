<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0a0c10;
    position: relative;
    font-family: 'Orbitron', sans-serif;
    color: #e8eaed;
    background-image:
      radial-gradient(ellipse at 18% 50%, rgba(230,57,70,0.10) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 30%, rgba(0,180,216,0.09) 0%, transparent 50%),
      linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size: auto, auto, 60px 60px, 60px 60px;
  }
  .frame {
    position: absolute; inset: 26px;
    border: 1px solid rgba(255,255,255,0.10);
  }
  .corner { position: absolute; width: 26px; height: 26px; }
  .corner::before, .corner::after { content: ''; position: absolute; background: #e63946; }
  .corner.tl { top: -2px; left: -2px; }
  .corner.tl::before { width: 26px; height: 3px; } .corner.tl::after { width: 3px; height: 26px; }
  .corner.tr { top: -2px; right: -2px; }
  .corner.tr::before { width: 26px; height: 3px; right: 0; } .corner.tr::after { width: 3px; height: 26px; right: 0; }
  .corner.bl { bottom: -2px; left: -2px; }
  .corner.bl::before { width: 26px; height: 3px; bottom: 0; } .corner.bl::after { width: 3px; height: 26px; bottom: 0; }
  .corner.br { bottom: -2px; right: -2px; }
  .corner.br::before { width: 26px; height: 3px; bottom: 0; right: 0; } .corner.br::after { width: 3px; height: 26px; bottom: 0; right: 0; }
  .content {
    position: absolute;
    left: 80px; top: 50%;
    transform: translateY(-50%);
    max-width: 660px;
  }
  .label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 19px;
    letter-spacing: 5px;
    color: #00b4d8;
    margin-bottom: 18px;
  }
  h1 { font-size: 84px; font-weight: 900; line-height: 1.04; letter-spacing: -1px; }
  h1 .red { color: #e63946; }
  .role {
    font-family: 'Share Tech Mono', monospace;
    font-size: 25px;
    letter-spacing: 4px;
    color: #f4a620;
    margin-top: 22px;
  }
  .tags {
    font-family: 'Share Tech Mono', monospace;
    font-size: 19px;
    color: #9badc4;
    margin-top: 26px;
    letter-spacing: 1px;
  }
  .url {
    position: absolute;
    left: 80px; bottom: 58px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 21px;
    letter-spacing: 3px;
    color: #e63946;
  }
  .mecha {
    position: absolute;
    right: 60px; top: 50%;
    transform: translateY(-50%);
    width: 400px;
  }
</style>
</head>
