<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Signal Lost | humerez.dev</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10; --red: #e63946; --blue: #00b4d8; --text: #e8eaed; --muted: #6b7a90;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 2rem;
    background-image:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .code {
    font-family: 'Orbitron', sans-serif; font-weight: 900;
    font-size: clamp(4rem, 18vw, 9rem); color: var(--red);
    text-shadow: 0 0 40px rgba(230,57,70,0.4);
    animation: flicker 3s infinite;
  }
  @keyframes flicker { 0%,92%,96%,100% { opacity: 1; } 94% { opacity: 0.55; } }
  .msg { letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin: 1rem 0 2.5rem; }
  a {
    color: var(--blue); text-decoration: none; border: 1px solid var(--blue);
    padding: 0.9rem 2rem; letter-spacing: 2px; text-transform: uppercase; font-size: 0.8rem;
    clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
    transition: background 0.3s, color 0.3s;
  }
  a:hover { background: var(--blue); color: var(--bg); }
  @media (prefers-reduced-motion: reduce) { .code { animation: none; } }
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <p class="msg">// Signal lost — target not found · Señal perdida — objetivo no encontrado</p>
  <a href="/">Return to base · Volver a la base</a>
</main>
</body>
</html>
