# humerez.dev landing — served by the `landing` nginx container in /opt/traefik.
# Deployed copy lives at /opt/traefik/landing/nginx.conf (mounted read-only).
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # security headers
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # compression
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain application/xml text/xml;
    gzip_min_length 512;

    error_page 404 /404.html;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    location = /favicon.ico {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
